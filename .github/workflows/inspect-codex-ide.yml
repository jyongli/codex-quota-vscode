name: Inspect official Codex IDE integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-codex-ide.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect public documentation and extension package
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, zipfile, io, json, re, gzip
          def notice(title, value):
              text = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=' + title + '::' + text)
          for slug in ['auth', 'ide/settings', 'pricing']:
              try:
                  url = 'https://developers.openai.com/codex/' + slug
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  body = urllib.request.urlopen(req, timeout=20).read().decode()
                  body = re.sub(r'<(script|style)\b.*?</\1>', '', body, flags=re.S)
                  main = re.search(r'<main\b[^>]*>(.*?)</main>', body, re.S)
                  if main: body = main.group(1)
                  plain = re.sub(r'\s+', ' ', re.sub('<[^>]+>', ' ', body))
                  samples = []
                  for match in re.finditer(r'CODEX_HOME|shared|share authentication|credential|cliExecutable|runCodexInWindows|sign.in|SSH|remote|limit|5.hour', plain, re.I):
                      sample = plain[max(0, match.start()-140):match.start()+300]
                      if sample not in samples:
                          samples.append(sample)
                  notice('Official docs ' + slug, '\n'.join(samples[:18]))
              except Exception as error:
                  notice('Official docs unavailable', slug + ': ' + type(error).__name__)
          archive = None
          for suffix in ['?targetPlatform=linux-x64', '?targetPlatform=win32-x64', '']:
              url = 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/openai/vsextensions/chatgpt/latest/vspackage' + suffix
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/octet-stream'})
                  response = urllib.request.urlopen(req, timeout=45)
                  body = response.read()
                  print('Public package Content-Encoding: ' + str(response.headers.get('Content-Encoding')))
                  if body[:2] == b'\x1f\x8b': body = gzip.decompress(body)
                  archive = zipfile.ZipFile(io.BytesIO(body))
                  notice('Package download', suffix + ' size=' + str(len(body)))
                  break
              except Exception as error:
                  print('Public package fallback: ' + suffix + ' ' + type(error).__name__)
          if archive is None:
              raise SystemExit(0)
          manifest = json.loads(archive.read('extension/package.json'))
          props = manifest.get('contributes', {}).get('configuration', {})
          props = props if isinstance(props, list) else [props]
          settings = {key: value for group in props for key, value in group.get('properties', {}).items()}
          notice('Official IDE manifest', json.dumps({key: manifest.get(key) for key in ['name','publisher','version','main','extensionKind','extensionDependencies','activationEvents']}, ensure_ascii=False))
          notice('Official IDE settings', json.dumps(settings, ensure_ascii=False))
          notice('Official IDE commands', json.dumps(manifest.get('contributes', {}).get('commands', []), ensure_ascii=False))
          main = manifest.get('main', '').removeprefix('./')
          source = archive.read('extension/' + main).decode()
          patterns = [r'CODEX_HOME', r'cliExecutable', r'runCodexInWindowsSubsystemForLinux', r'account/rateLimits/read', r'account/read', r'chatgptAuthTokens', r'exports=', r'exports\.', r'getCodexHome', r'auth\.json', r'globalStorage', r'secrets\.', r'codexHome', r'--listen', r'app-server']
          reports = []
          for index, pattern in enumerate(patterns):
              samples = []
              for match in re.finditer(pattern, source):
                  snippet = source[max(0,match.start()-220):match.start()+420]
                  if snippet not in samples:
                      samples.append(snippet)
                  if len(samples) == 5:
                      break
              reports.append(pattern + ':\n' + '\n'.join(samples))
          notice('IDE sources', '\n\n'.join(reports))
          notice('IDE bundle tail', source[-7000:])
          PY
