name: Compress icon with Tinify

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tinify-icon.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compress the public extension icon using Tinify
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPCookieProcessor
          from urllib.error import HTTPError
          from http.cookiejar import CookieJar
          from urllib.parse import urlparse
          import json, struct

          icon = Path('resources/icon.png')
          original = icon.read_bytes()
          opener = build_opener(HTTPCookieProcessor(CookieJar()))
          headers = {'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'}
          service = 'https://tinify.cn'
          try:
            # Use the same public anonymous compression endpoint as the website.
            with opener.open(Request(service + '/', headers=headers), timeout=30) as response:
              print(f'::notice title=Tinify website::HTTP {response.status}')
            request = Request(service + '/backend/opt/shrink', data=original, headers={
              **headers, 'Content-Type': 'application/octet-stream',
              'Origin': service, 'Referer': service + '/',
            }, method='POST')
            with opener.open(request, timeout=60) as response:
              result = json.load(response)
            output = result.get('output', {})
            url = output.get('url', '')
            parsed = urlparse(url)
            assert parsed.scheme == 'https' and parsed.hostname in {'tinify.cn', 'tinypng.com', 'tinify.com'}, 'Unexpected compression output host'
            with opener.open(Request(url, headers=headers), timeout=30) as response:
              compressed = response.read(1024 * 1024 + 1)
            assert compressed[:8] == b'\x89PNG\r\n\x1a\n' and len(compressed) < len(original), 'Expected a smaller PNG'
            assert struct.unpack('>II', compressed[16:24]) == (256, 256), 'Icon dimensions must stay 256x256'
            icon.write_bytes(compressed)
            print(f'::notice title=Tinify compression verified::Input {len(original)} bytes; output {len(compressed)} bytes; 256x256 PNG')
          except HTTPError as error:
            print(f'::error title=Tinify request failed::HTTP {error.code} at {urlparse(error.url).hostname}; no credentials supplied')
            raise
          except Exception as error:
            print(f'::error title=Tinify compression failed::{type(error).__name__}: {str(error)[:250]}')
            raise
          PY
      - name: Save the compressed result for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c automation/tinify-icon-v017
          git add resources/icon.png
          git commit -m 'chore: compress public quota icon using Tinify'
          git push origin HEAD:refs/heads/automation/tinify-icon-v017
