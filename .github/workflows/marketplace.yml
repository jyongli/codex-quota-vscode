name: Publish VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tested GitHub release tag, for example v0.1.13'
        required: true
        default: v0.1.13
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/marketplace.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-quota-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Marketplace credential
        id: credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Marketplace credential missing::VSCE_PAT is not configured; no upload was attempted.'
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Marketplace publication has not run: repository secret `VSCE_PAT` is missing.

          Create or confirm Marketplace publisher `ujyong`, add an Azure DevOps PAT with **Marketplace: Manage** permissions as repository secret `VSCE_PAT`, then run this workflow manually with tag `v0.1.13`.

          Alternatively, upload the release VSIX directly in Marketplace publisher `ujyong` using your Microsoft account; browser upload does not require this GitHub secret.

          No credentials should be added to source files or pasted into chat.
          SUMMARY
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Select and verify tested release
        if: steps.credential.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          release_tag="${REQUESTED_TAG:-v$(node -p "require('./package.json').version")}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid stable release tag'; exit 1; }
          release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$release_sha" --limit 100 \
            --json headSha,conclusion --jq '.[] | select(.conclusion == "success") | .headSha' \
            > "$RUNNER_TEMP/codex-quota-successful-tests.txt"
          grep -Fxq "$release_sha" "$RUNNER_TEMP/codex-quota-successful-tests.txt" || {
            echo 'This release commit has no successful Windows/Linux Test and package run.'
            exit 1
          }
          release_version="${release_tag#v}"
          git show "$release_tag:package.json" > "$RUNNER_TEMP/codex-quota-release-manifest.json"
          release_name="$(node -p "require(process.argv[1]).name" "$RUNNER_TEMP/codex-quota-release-manifest.json")"
          release_file="$release_name-$release_version.vsix"
          release_dir="$RUNNER_TEMP/codex-quota-marketplace-release"
          mkdir -p "$release_dir"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" \
            --pattern "$release_file" --pattern "$release_file.sha256"
          git show "$release_tag:releases/$release_tag/$release_file.sha256" \
            > "$RUNNER_TEMP/codex-quota-committed-checksum.txt"
          cmp "$RUNNER_TEMP/codex-quota-committed-checksum.txt" "$release_dir/$release_file.sha256"
          (cd "$release_dir" && sha256sum --check "$release_file.sha256")
          printf '%s\n' "RELEASE_VERSION=$release_version" "MARKETPLACE_VSIX=$release_dir/$release_file" >> "$GITHUB_ENV"
      - run: npm ci
        if: steps.credential.outputs.ready == 'true'
      - name: Validate the existing single-VSIX package
        if: steps.credential.outputs.ready == 'true'
        run: node scripts/verify-marketplace.mjs "$MARKETPLACE_VSIX" "$RELEASE_VERSION"
      - name: Verify publisher access
        if: steps.credential.outputs.ready == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce verify-pat ujyong
      - name: Publish the tested VSIX
        if: steps.credential.outputs.ready == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "$MARKETPLACE_VSIX" --skip-duplicate
      - name: Record Marketplace submission
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          Submitted **Codex Quota $RELEASE_VERSION** to the VS Code Marketplace using the existing verified GitHub release VSIX.

          Extension: https://marketplace.visualstudio.com/items?itemName=ujyong.codex-quota-monitor-ujyong

          Marketplace validation and indexing can take several minutes. One VSIX and one extension ID are published; the same extension runs on its installation host locally or remotely.
          SUMMARY
      - name: Check public Marketplace visibility
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if timeout 20s npx --no-install vsce show ujyong.codex-quota-monitor-ujyong --json \
                > "$RUNNER_TEMP/codex-quota-marketplace-item.json" 2>/dev/null && \
              node - "$RUNNER_TEMP/codex-quota-marketplace-item.json" "$RELEASE_VERSION" <<'JS'
          const fs = require('node:fs');
          try {
            const item = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const visible = item?.publisher?.publisherName === 'ujyong' && item.extensionName === 'codex-quota-monitor-ujyong'
              && item.versions?.some(version => version.version === process.argv[3]);
            process.exit(visible ? 0 : 1);
          } catch { process.exit(1); }
          JS
            then
              echo "::notice title=Marketplace version verified::ujyong.codex-quota-monitor-ujyong $RELEASE_VERSION is visible in the public gallery."
              echo "Public Marketplace version verified: $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" != 6 ]; then sleep 10; fi
          done
          echo '::notice title=Marketplace validation pending::Upload was accepted; public validation or indexing is still pending.'
          echo 'The package was submitted; the public gallery has not confirmed this version yet.' >> "$GITHUB_STEP_SUMMARY"
