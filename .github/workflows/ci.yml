name: Test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:bundle
      - name: Install and test the official npm CLI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-quota-native" --no-package-lock @openai/codex@0.162.1
          node scripts/test-native.mjs "$RUNNER_TEMP/codex-quota-native/node_modules/@openai/codex/bin/codex.js"
          printf '%s\n' "CODEX_QUOTA_NATIVE_CLI=$RUNNER_TEMP/codex-quota-native/node_modules/@openai/codex/bin/codex.js" >> "$GITHUB_ENV"
      - name: Cache the fixed VS Code test host
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-1.95.3
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - if: runner.os == 'Windows'
        run: npm run test:vscode
      - run: npm run package
      - name: Verify Marketplace publisher and VSIX identity
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          node scripts/verify-marketplace.mjs "artifacts/codex-quota-vscode-$package_version.vsix" "$package_version"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-quota-vsix-${{ matrix.os }}
          path: artifacts/*.vsix
