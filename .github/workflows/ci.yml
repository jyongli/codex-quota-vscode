name: Test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:bundle
      - run: xvfb-run -a npm run test:vscode
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: codex-quota-vsix
          path: artifacts/*.vsix
