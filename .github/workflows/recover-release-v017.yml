name: Resume verified v0.1.17 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-release-v017.yml']

permissions:
  contents: read
  actions: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Revalidate the frozen release using the corrected smoke-test budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
