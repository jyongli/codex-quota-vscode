name: Publish GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-quota-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:bundle
      - name: Test the official Windows npm CLI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-quota-native" --no-package-lock @openai/codex@0.162.1
          node scripts/test-native.mjs "$RUNNER_TEMP/codex-quota-native/node_modules/@openai/codex/bin/codex.js"
          printf '%s\n' "CODEX_QUOTA_NATIVE_CLI=$RUNNER_TEMP/codex-quota-native/node_modules/@openai/codex/bin/codex.js" >> "$GITHUB_ENV"
      - name: Cache the fixed VS Code test host
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-1.95.3
      - run: npm run test:vscode
  release:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select release version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(node -p "require('./package.json').version")"
          fi
          git rev-parse --verify "refs/tags/$release_tag"
          printf '%s\n' "RELEASE_TAG=$release_tag" "RELEASE_DIR=releases/$release_tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run test:bundle
      - name: Test the official Linux npm CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-quota-native" --no-package-lock @openai/codex@0.162.1
          node scripts/test-native.mjs "$RUNNER_TEMP/codex-quota-native/node_modules/@openai/codex/bin/codex.js"
          printf '%s\n' "CODEX_QUOTA_NATIVE_CLI=$RUNNER_TEMP/codex-quota-native/node_modules/@openai/codex/bin/codex.js" >> "$GITHUB_ENV"
      - name: Cache the fixed VS Code test host
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-1.95.3
      - run: xvfb-run -a npm run test:vscode
      - name: Verify the tested VSIX
        run: |
          cd "$RELEASE_DIR"
          sha256sum --check ./*.sha256
      - name: Create release and upload VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR"/*.vsix "$RELEASE_DIR"/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Codex Quota $RELEASE_TAG" \
            --notes-file "$RELEASE_DIR/NOTES.md"
      - name: Cancel superseded active main-branch tests after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --limit 100 \
            --json databaseId,headSha,status \
            --jq '.[] | select(.status != "completed") | [.databaseId, .headSha] | @tsv' \
            > "$RUNNER_TEMP/codex-quota-active-tests.tsv"
          while IFS=$'\t' read -r stale_run_id stale_run_sha; do
            if [ "$stale_run_sha" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$stale_run_sha" "$GITHUB_SHA"; then
              if ! gh run cancel "$stale_run_id" --repo "$GITHUB_REPOSITORY"; then
                stale_run_status="$(gh run view "$stale_run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
                [ "$stale_run_status" = completed ] || exit 1
              fi
            fi
          done < "$RUNNER_TEMP/codex-quota-active-tests.tsv"
